services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naraclip-app
    restart: unless-stopped
    ports:
      - '${PORT:-3333}:3333'
    environment:
      NODE_ENV: production
      PORT: 3333
      HOST: 0.0.0.0
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:3333}
      SESSION_DRIVER: cookie
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-naraclip}
      DB_PASSWORD: ${DB_PASSWORD:-naraclip_secret}
      DB_DATABASE: ${DB_DATABASE:-naraclip}
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: naraclip
      # Object Storage (MinIO S3)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-naraclip}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-naraclipadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-naraclipsecret}
      MINIO_CONSOLE_PORT: ${MINIO_CONSOLE_PORT:-9001}
      MINIO_SIGNED_URL_TTL_SECONDS: ${MINIO_SIGNED_URL_TTL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - naraclip-net

  postgres:
    image: postgres:17-alpine
    container_name: naraclip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-naraclip}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-naraclip_secret}
      POSTGRES_DB: ${DB_DATABASE:-naraclip}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-naraclip} -d ${DB_DATABASE:-naraclip}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - naraclip-net

  redis:
    image: redis:7-alpine
    container_name: naraclip-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - naraclip-net

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: naraclip-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-naraclipadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-naraclipsecret}
    volumes:
      - miniodata:/data
    ports:
      - '9000:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # Web UI Console
    networks:
      - naraclip-net

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  naraclip-net:
    driver: bridge
